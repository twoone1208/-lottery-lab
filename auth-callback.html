<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登入中 · 統計學人生</title>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
</head>
<body>
  <p id="auth-status" role="status">正在完成登入…</p>
  <a href="./index.html#home">返回首頁</a>
  <script>
    // 獨立回站頁先處理 OAuth 回傳，避免主站的雜湊路由先移除登入憑證。
    (async () => {
      try {
        const config = window.LOTTO_CLOUD_CONFIG;
        const client = supabase.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY, {
          auth: { persistSession: true, autoRefreshToken: true,
            detectSessionInUrl: true, storageKey: config.AUTH_STORAGE_KEY }
        });
        const callback = new URL(location.href);
        const params = new URLSearchParams(location.hash.slice(1));
        const failure = callback.searchParams.get('error_code') || params.get('error_code') || callback.searchParams.get('error') || params.get('error');
        if (failure) throw Error('LINE 登入驗證失敗，請聯絡管理員。錯誤代碼：' + failure.replace(/[^a-z0-9_-]/gi, '').slice(0,64));
        const { data, error } = callback.searchParams.has('code')
          ? await client.auth.exchangeCodeForSession(callback.searchParams.get('code'))
          : await client.auth.getSession();
        if (error) throw error;
        if (!data.session) throw Error('未收到登入憑證，請在同一個 Safari 瀏覽器重新從網站按 LINE 登入。');
        history.replaceState(null, '', location.pathname);
        location.replace('./index.html#home');
      } catch (error) {
        history.replaceState(null, '', location.pathname);
        document.getElementById('auth-status').textContent = error.message;
      }
    })();
  </script>
</body>
</html>
