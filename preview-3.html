<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b171d"><title>抓牌研究室 3.0｜操作預覽</title><style>
/* 深色與青色設計，桌面側欄、iPhone底部導覽共用相同功能 */
:root{color-scheme:dark;--bg:#09141a;--panel:#10232c;--border:#29414b;--text:#e4f0f4;--muted:#94acb7;--cyan:#48d9df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 system-ui,-apple-system,"Microsoft JhengHei",sans-serif}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer}button,.button{border:1px solid var(--border);border-radius:10px;background:#19343f;color:var(--text);padding:10px 15px;text-decoration:none}button:hover{border-color:var(--cyan)}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,a:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}.primary{background:var(--cyan);color:#082129;font-weight:750;border-color:var(--cyan)}header{position:sticky;top:0;z-index:5;background:#0c1b22f5;border-bottom:1px solid var(--border);padding:15px 28px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;align-items:center;gap:12px}.logo{border-radius:13px;background:var(--cyan);color:#082129;font-weight:900;padding:9px;font-size:20px}.brand b{display:block;font-size:18px}.brand small{font-size:10px;letter-spacing:2px;color:var(--muted)}.badge{color:var(--cyan);background:#173840;border:1px solid #2b5860;border-radius:20px;padding:4px 10px;font-size:12px;white-space:nowrap}.shell{display:grid;grid-template-columns:210px 1fr;max-width:1500px;margin:auto}nav{padding:26px 15px;position:sticky;top:85px;height:calc(100dvh - 85px);border-right:1px solid var(--border)}nav a{display:block;text-decoration:none;color:var(--muted);padding:13px;margin-bottom:8px;border-radius:10px}nav a.active{background:#1b3d46;color:var(--cyan)}nav span{margin-right:10px}main{padding:28px 36px 80px;min-width:0}.notice{border:1px solid #45616d;background:#142a34;padding:12px 16px;border-radius:12px;color:#bdcfd7;font-size:13px}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:2px}h1{font-size:30px;margin:5px 0 8px;letter-spacing:-1px}h2{font-size:19px;margin:0 0 14px}h3{font-size:16px;margin:0 0 8px}p{margin:8px 0}.muted,small{color:var(--muted)}.heading{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:25px 0}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}select,input{background:#0b1a22;color:var(--text);border:1px solid #39525d;border-radius:9px;padding:10px;min-width:0;font-size:16px}label{display:grid;gap:6px;color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.stat,.panel,.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px}.stat strong{display:block;font-size:28px;margin:7px 0;color:var(--text)}.stat small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{margin-bottom:18px}.card .ball{display:grid;place-items:center;width:65px;height:65px;border-radius:50%;background:var(--cyan);color:#06242b;font-size:32px;font-weight:850;margin:18px 0}.card .topline{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.card button{width:100%;margin-top:16px}.metric{font-size:25px;color:var(--cyan);font-weight:750}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}td,th{text-align:left;padding:13px 10px;border-bottom:1px solid var(--border);font-size:13px}th{color:var(--muted);font-weight:500}.numbers{font-size:18px;letter-spacing:4px;color:var(--cyan);font-weight:750}.tag{display:inline-block;padding:3px 8px;border-radius:6px;background:#24404a;color:#bbd9e1;font-size:12px}.good{color:#72dfb3}.warn{color:#f0c67d}.form{display:grid;grid-template-columns:1fr 1fr;gap:15px}.form .full{grid-column:1/-1}.check{display:flex;align-items:flex-start;gap:10px;color:var(--text);font-size:14px}.check input{margin-top:6px;accent-color:var(--cyan)}.step{display:flex;align-items:center;gap:15px;padding:15px 0;border-bottom:1px solid var(--border)}.step b{background:#21454d;color:var(--cyan);border-radius:9px;padding:5px 12px}.empty{border:1px dashed var(--border);border-radius:12px;padding:25px;text-align:center;color:var(--muted)}dialog{background:var(--panel);color:var(--text);border:1px solid #47616a;border-radius:18px;padding:0;width:min(680px,94vw);max-height:85dvh}dialog::backdrop{background:#030c12c9;backdrop-filter:blur(5px)}.dialoghead{position:sticky;top:0;background:var(--panel);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding:16px 20px;z-index:1}.dialogbody{padding:20px;overflow-y:auto;max-height:65dvh}.dialogfoot{padding:14px 20px;border-top:1px solid var(--border)}details{border:1px solid var(--border);border-radius:10px;padding:14px;margin:12px 0}summary{cursor:pointer}#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#d9f7f6;color:#10242c;border-radius:10px;padding:12px 20px;z-index:20;display:none;max-width:90vw}.pillrow{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.smalltext{font-size:12px}.subnav{display:flex;gap:8px;overflow:auto;margin:15px 0}.subnav button{white-space:nowrap}.subnav .selected{background:#24606a;color:white}footer{color:var(--muted);font-size:12px;margin-top:25px}.wide{grid-column:1/-1}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.shell{grid-template-columns:180px 1fr}main{padding:22px}}@media(max-width:700px){header{padding:12px 16px}.brand b{font-size:16px}.brand small{font-size:8px}.logo{font-size:17px}.shell{display:block}main{padding:18px 16px 115px}nav{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:6;height:auto;display:flex;justify-content:space-around;background:#0c2029f5;padding:7px 3px calc(7px + env(safe-area-inset-bottom));border:0;border-top:1px solid var(--border)}nav a{padding:7px 3px;margin:0;text-align:center;font-size:10px;flex:1}nav span{display:block;margin:0;font-size:20px}.stats{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px}.twocol{grid-template-columns:1fr}.heading{display:block}h1{font-size:26px}.heading .toolbar{margin-top:15px}.card{padding:14px}.form{grid-template-columns:1fr}.form .full{grid-column:auto}dialog{max-height:88dvh}.dialogbody{max-height:62dvh}.hidephone{display:none}}
</style></head><body><header><div class="brand"><div class="logo">539</div><div><b>抓牌研究室 <span style="color:var(--cyan)">3.0</span></b><small>OPEN ANALYSIS LAB</small></div></div><span class="badge">互動預覽 · 示範資料</span></header><div class="shell"><nav aria-label="主要導覽"><a href="#overview"><span>⌂</span>研究總覽</a><a href="#rank"><span>◇</span>綜合推薦</a><a href="#library"><span>∑</span>公式研究庫</a><a href="#tracking"><span>◎</span>觸發核驗</a><a href="#personal"><span>♙</span>個人研究</a><a href="#admin"><span>⚙</span>公司後台</a></nav><main><div class="notice">這是獨立操作預覽，數字與績效均為虛構示例。沒有連線會員、資料庫或背景排程，也不會改動正式網站。</div><div class="heading"><div><span class="eyebrow">RESEARCH WORKSPACE</span><h1 id="title"></h1><p id="subtitle" class="muted"></p></div><div class="toolbar"><label>彩種<select id="game"><option value="539">今彩539</option><option value="daily">天天樂</option><option value="mark6">六合彩</option></select></label><button id="export">匯出預覽資料 ↗</button></div></div><section id="content"></section><footer>研究排序與歷史命中指標不代表未來開獎機率。預覽新增內容只在本頁記憶體，重新整理即重設。</footer></main></div><dialog id="modal"><div class="dialoghead"><h2 id="modalTitle" style="margin:0"></h2><button id="close" aria-label="關閉視窗">✕</button></div><div id="modalBody" class="dialogbody"></div><div class="dialogfoot"><button id="back" style="width:100%">關閉 · 返回原頁</button></div></dialog><div id="toast" role="status"></div><script>
/* 全部為隔離的示範狀態；不讀取正式網站的localStorage、不呼叫任何API。 */
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={game:'539',count:8,consent:true,registration:true,scan:false,libraryFilter:'all',adminTab:'overview',rules:[{id:'CMP-001',name:'雙碼同開 · 上7期順1加31',type:'雙碼定位',status:'正式推薦',formula:'13＋19 同開 → 上7期順1＋31 → 下2期',hits:'8 / 12',forward:'2 / 5'},{id:'CMP-002',name:'順5拖牌 · 11／14二中一',type:'二中一',status:'啟用研究觸發',formula:'順5開35 → 下3期 → 11／14',hits:'7 / 10',forward:'1 / 3'},{id:'CMP-003',name:'循環合數 · 翻轉支線',type:'循環翻轉',status:'待審核',formula:'準碼＋31 → 39循環 → 獨立翻轉',hits:'6 / 11',forward:'0 / 2'},{id:'CMP-004',name:'樓梯順位 · 合數26',type:'階梯分析',status:'待研究',formula:'往上4期 → 樓梯順位 → 循環合數26',hits:'尚未回測',forward:'尚無樣本'}],favorites:new Set()};
const names={'539':'今彩539',daily:'天天樂',mark6:'六合彩'},titles={overview:['研究總覽','從資料更新到公式核驗，集中查看研究流程。'],rank:['綜合推薦','依方法族整理支持證據，保留每一次推薦版本。'],library:['中央公式研究庫','公司公式版本、研究狀態與推薦參與權限。'],tracking:['自動觸發與核驗','先固定推薦，再等待目標期結果。'],personal:['個人研究中心','私人版路、收藏與研究授權設定。'],admin:['總大腦管理後台','管理研究流程與服務狀態；目前為角色操作示範。']};
const stat=(label,value,note)=>`<div class="stat"><small>${label}</small><strong>${value}</strong><small>${note}</small></div>`;
const gate=()=>state.consent?'':`<div class="notice warn">你已取消研究授權，依目前預覽設定，新增公式與綜合推薦已停用。可到「個人研究」調整。</div>`;
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').style.display='none',3200)}
function modal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').showModal()}function close(){if($('modal').open)$('modal').close()}$('close').onclick=close;$('back').onclick=close;$('modal').onclick=e=>{if(e.target===$('modal')){const r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close()}};
function formula(n){modal(`號碼 ${String(n).padStart(2,'0')} 的推算公式`,`<p class="badge">示範快照 DEMO-001 · 非真實推薦</p><p>目標：2026/11/02（星期一）｜資料截止：2026/10/31</p><p class="muted">以下統計皆為介面示例，與實際開獎無關。</p>${state.rules.slice(0,3).map((r,i)=>`<details><summary>${esc(r.formula)} → ${n}</summary><p>版本 v1 · 來源：公司示範公式</p><p>歷史回測 ${r.hits}｜建立後前瞻 ${r.forward}</p><p>範例準碼 04＋31＝35；其他號碼卡僅展示版面，不代表本公式可推出該號。</p></details>`).join('')}<p>不同組型與公式分開核驗，不把歷史百分比當作未來機率。</p>`)}
function rank(){if(!state.consent)return gate();const nums=state.game==='mark6'?[6,12,23,34,41,49,18,32,8,11,15,22]:[6,12,8,31,34,4,13,32,17,19,23,35];return `<div class="panel"><div class="toolbar"><label>推薦顆數<select id="count">${[3,5,8,10,12].map(n=>`<option ${state.count===n?'selected':''}>${n}</option>`).join('')}</select></label><button class="primary" data-action="recommend">重新產生示範快照</button><span class="badge">目標 2026/11/02（星期一）</span></div><p class="muted smalltext">DEMO-001 · 截止10/31 · 非即時資料 · 不同彩種日期僅作畫面示例</p></div><div class="grid">${nums.slice(0,state.count).map((n,i)=>`<article class="card"><div class="topline"><span>第${i+1}名</span><span>${5-i%3}類示範支持</span></div><div class="ball">${String(n).padStart(2,'0')}</div><small>歷史研究指標（示例）</small><div class="metric">${(72-i*2.3).toFixed(1)}</div><small>前瞻命中另列，不合併成機率</small><button data-number="${n}">查看推算公式 ↗</button></article>`).join('')}</div>`}
function library(){const filtered=state.rules.filter(r=>state.libraryFilter==='all'||r.status===state.libraryFilter);return `${gate()}<div class="panel"><div class="toolbar"><select id="filter"><option value="all">全部狀態</option>${['正式推薦','啟用研究觸發','待審核','待研究','停用'].map(x=>`<option ${state.libraryFilter===x?'selected':''}>${x}</option>`).join('')}</select><button class="primary" data-action="add" ${state.consent?'':'disabled'}>＋ 新增公司公式</button><button data-action="import">批次匯入示範</button></div></div><div class="panel tablewrap"><table><thead><tr><th>公式／版本</th><th>研究狀態</th><th>回測 H/N</th><th>前瞻 H/N</th><th>操作</th></tr></thead><tbody>${filtered.map(r=>`<tr><td><b>${esc(r.name)}</b><br><small>${r.id} · v1 · ${r.type}</small></td><td><span class="tag">${r.status}</span></td><td>${r.hits}</td><td>${r.forward}</td><td><button data-rule="${r.id}">管理</button></td></tr>`).join('')}</tbody></table>${filtered.length?'':'<p class="empty">此狀態沒有公式。</p>'}</div>`}
function tracking(){return `<div class="stats">${stat('今日示範觸發',state.scan?6:4,'僅模擬流程')}${stat('待開候選',3,'已固定示範版本')}${stat('等待來源',1,'缺落球順序暫停')}${stat('核驗完成',2,'回測與前瞻分開')}</div><div class="panel"><div class="toolbar"><h2 style="flex:1;margin:0">觸發工作台</h2><button data-action="scan">模擬新一期掃描</button></div><div class="tablewrap"><table><thead><tr><th>目標／來源</th><th>候選</th><th>狀態</th><th>紀錄</th></tr></thead><tbody><tr><td>11/02 · DEMO-001<br><small>截止10/31</small></td><td class="numbers">06 12 08</td><td class="warn">待開（示例）</td><td><button data-action="snapshot">查看快照</button></td></tr><tr><td>歷史示範 DEMO-000</td><td class="numbers">11 14</td><td class="good">二中一 · 命中示例</td><td><button data-action="verify">查看核驗</button></td></tr><tr><td>落球公式 CMP-003</td><td>—</td><td>等待球序來源</td><td>不以順球替代</td></tr></tbody></table></div></div><div class="panel"><h2>核驗原則</h2><p>原始快照保持不變，開獎結果另新增核驗紀錄。資料修正再追加版本。</p><p class="muted">此頁按鈕只示範狀態，不執行背景工作，也不取得最新開獎。</p></div>`}
function personal(){return `<div class="twocol"><div class="panel"><h2>示範會員</h2><p>研究者 DEMO · beta_free</p><p class="muted">不需要信用卡。此預覽沒有真實註冊、登入及跨裝置同步，請勿輸入帳號或密碼。</p><div class="pillrow"><span class="badge">免費試營運</span><span class="tag">收藏 ${state.favorites.size} 筆</span></div><button data-action="add" ${state.consent?'':'disabled'}>＋ 新增個人公式</button></div><div class="panel"><h2>研究授權與功能使用</h2><label class="check"><input type="checkbox" id="consent" ${state.consent?'checked':''}><span>同意將指定公式版本提供平台內部研究使用。<br><small>依本次要求預設勾選；取消後無法新增公式及查看綜合推薦。此設定只在預覽記憶體生效。</small></span></label><p class="muted smalltext">研究使用不等於所有權轉讓。正式版需要條款、精確版本授權及撤回紀錄；此頁不建立法律授權或傳送公式。</p></div></div><div class="panel"><h2>個人收藏</h2>${state.favorites.size?[...state.favorites].map(id=>`<p>${esc(state.rules.find(r=>r.id===id)?.name||id)} <button data-favorite="${id}">移除收藏</button></p>`).join(''):'<p class="empty">尚未收藏。到「公式研究庫 → 管理」試試收藏功能。</p>'}</div>`}
function admin(){return `<div class="notice">角色示範：super_admin。這不是實際管理權限，正式環境必須由後端驗證。</div><div class="subnav">${[['overview','營運總覽'],['settings','會員與開關'],['jobs','排程監控'],['consents','授權研究'],['payments','訂閱預留']].map(([k,v])=>`<button class="${state.adminTab===k?'selected':''}" data-tab="${k}">${v}</button>`).join('')}</div>${state.adminTab==='overview'?`<div class="stats">${stat('公司公式',state.rules.length,'含待研究版本')}${stat('正式推薦',state.rules.filter(r=>r.status==='正式推薦').length,'示範狀態')}${stat('研究待審',1,'尚未接資料庫')}${stat('同步狀態','預覽','不會自動更新')}</div><div class="panel"><h2>管理工作捷徑</h2><div class="toolbar"><a class="button" href="#library">公司版路管理 →</a><a class="button" href="#tracking">推薦與核驗 →</a><button data-action="import">公式批次匯入</button></div></div>`:state.adminTab==='settings'?`<div class="panel"><h2>免費試營運設定</h2><label class="check"><input id="registration" type="checkbox" ${state.registration?'checked':''}>開放會員註冊（示範）</label><p>預設方案：beta_free</p><p>註冊狀態：${state.registration?'開放':'關閉'}</p><p class="muted">邀請碼、額度、管理角色需後端實作；此處不變更真實會員。</p></div>`:state.adminTab==='jobs'?`<div class="panel"><h2>排程尚未連線</h2><p class="empty">正式雲端排程未部署。此預覽沒有執行中的worker。</p><button data-action="scan">測試一次模擬工作</button></div>`:state.adminTab==='consents'?`<div class="panel"><h2>會員授權研究庫</h2><p>尚無真實授權資料。</p><p class="muted">指定版本授權 → 去重 → 研究回測 → 前瞻追蹤 → 管理核准。撤回時停止後續授權研究；多來源各自追溯。</p></div>`:`<div class="panel"><h2>付款功能保持關閉</h2><span class="badge">payment_enabled = false</span><p>目前：免費 beta_free</p><p class="muted">未來預留：週 NT$300／7天、月 NT$1,000／30天。此頁無付款、無續訂、無信用卡輸入。</p></div>`}`}
function overview(){return `<div class="stats">${stat('啟用公司公式',1,'示範數據')}${stat('今日觸發',4,'含研究追蹤')}${stat('待開快照',1,'不會事後改寫')}${stat('資料狀態','示範','非最新開獎')}</div><div class="twocol"><div class="panel"><span class="eyebrow">NEXT RESEARCH</span><h2>下一期研究工作台</h2><p>選彩種、查看候選，再追溯每條支持公式。</p><p class="numbers">06　12　08</p><p class="muted">僅為UI展示，沒有執行預測運算。</p><a href="#rank" class="button">查看綜合推薦 →</a></div><div class="panel"><h2>研究流程</h2>${['公式建立與格式驗證','回測與建立後前瞻追蹤','管理核准後加入推薦','凍結快照、開獎後核驗'].map((s,i)=>`<div class="step"><b>${i+1}</b><span>${s}</span></div>`).join('')}</div></div><div class="panel"><h2>先試試這些操作</h2><div class="toolbar"><a class="button" href="#library">新增／管理公式</a><a class="button" href="#personal">授權與收藏</a><a class="button" href="#admin">查看管理後台</a></div></div>`}
function render(){const page=location.hash.slice(1)||'overview',key=titles[page]?page:'overview';$('title').textContent=titles[key][0];$('subtitle').textContent=names[state.game]+' · '+titles[key][1];document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.hash==='#'+key));$('content').innerHTML=({overview,rank,library,tracking,personal,admin}[key])();if($('count'))$('count').onchange=e=>{state.count=Number(e.target.value);render()};if($('filter'))$('filter').onchange=e=>{state.libraryFilter=e.target.value;render()};if($('consent'))$('consent').onchange=e=>{state.consent=e.target.checked;render();toast(state.consent?'預覽授權已勾選，功能恢復':'已停用新增公式與綜合推薦（預覽）')};if($('registration'))$('registration').onchange=e=>{state.registration=e.target.checked;render()};}
function add(){if(!state.consent)return toast('請先到個人研究調整授權設定');modal('新增公式 · 示範',`<form id="addForm" class="form"><label class="full">公式名稱<input name="name" required maxlength="60" placeholder="例如：順5開35，下3期二中一"></label><label>公式類型<select name="type"><option>單碼定位</option><option>雙碼定位</option><option>二中一</option><option>三中一</option><option>三中二</option><option>階梯分析</option></select></label><label>目標期距<input name="n" type="number" min="1" max="30" value="2" required></label><label>觸發號碼<input name="number" type="number" min="1" max="${state.game==='mark6'?49:39}" value="13" required></label><label>準期偏移<input name="offset" type="number" min="-30" max="30" value="-7" required></label><p class="full muted">此表單只新增一筆展示列，不執行運算、回測或上傳。儲存後一律為「待研究」，不會直接成為推薦。</p><button class="primary full" type="submit">新增展示公式</button></form>`);$('addForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=f.get('name').trim();if(!name)return;state.rules.push({id:'DEMO-'+String(state.rules.length+1).padStart(3,'0'),name,type:f.get('type'),status:'待研究',formula:`開${f.get('number')} · 準期${f.get('offset')} · 下${f.get('n')}期`,hits:'未回測',forward:'尚無樣本'});close();render();toast('已新增展示列；未執行研究或上傳')}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.number)return formula(Number(b.dataset.number));if(b.dataset.tab){state.adminTab=b.dataset.tab;return render()}if(b.dataset.favorite){const id=b.dataset.favorite;state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);close();render();return toast('已更新本頁示範收藏')}if(b.dataset.rule){const r=state.rules.find(x=>x.id===b.dataset.rule);return modal(r.name,`<p>${esc(r.formula)}</p><p>版本 v1 · 狀態 ${r.status}</p><p>歷史回測 ${r.hits}｜前瞻 ${r.forward}</p><p class="muted">正式啟用需要研究門檻及後端核准，此預覽不能直接升為正式推薦。</p><div class="toolbar"><button data-favorite="${r.id}">${state.favorites.has(r.id)?'移除收藏':'收藏公式'}</button><button data-pause="${r.id}">切換停用／待研究</button></div>`)}if(b.dataset.pause){const r=state.rules.find(x=>x.id===b.dataset.pause);r.status=r.status==='停用'?'待研究':'停用';close();render();return toast('已修改展示狀態，沒有變更正式公式')}switch(b.dataset.action){case'add':return add();case'recommend':return toast('已重繪示範榜單；未計算真實推薦');case'scan':state.scan=true;render();return toast('模擬掃描完成；沒有抓取開獎或啟動worker');case'snapshot':return modal('推薦快照 DEMO-001','<p>建立時間：2026/11/01 10:00（虛構示例）</p><p>來源截止：2026/10/31 · 目標：2026/11/02</p><p>候選：06／12／08 · 公式：CMP-001 v1</p><p>引擎：preview-only · 資料版本：demo</p><p class="muted">正式版將在伺服器固定快照；本預覽不產生可核驗的正式證據。</p>');case'verify':return modal('核驗示例','<p>候選組：11／14（二中一）</p><p>示範實開：02／11／20／31／35</p><p class="good">命中11 → 二中一成立（虛構示例）</p><p>原推薦不變，核驗另列。此結果未使用真實歷史資料。</p>');case'import':return modal('批次匯入 · 格式預覽','<p>正式版將支援JSON、CSV、Excel，先驗證再進待研究。</p><pre style="white-space:pre-wrap">名稱,彩種,定位號碼,N期,準期偏移\n範例公式,539,13,2,-7</pre><p class="muted">此預覽不讀取檔案，避免把私人公式誤送往示範平台。實際批次匯入尚未實作。</p>')}});
$('game').onchange=e=>{state.game=e.target.value;render()};$('export').onclick=()=>{const data={previewOnly:true,notProductionBackup:true,game:state.game,rules:state.rules,favorites:[...state.favorites],consentDemo:state.consent};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='3.0操作預覽_非正式備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)};window.addEventListener('hashchange',()=>{close();render();window.scrollTo(0,0)});render();
</script></body></html>
